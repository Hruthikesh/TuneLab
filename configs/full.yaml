# Research GPU configuration
mode: "full"
device: "cuda"
seed: 42

model:
  name: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  torch_dtype: "float16"
  max_seq_length: 1024
  quantization: "4bit"

retrieval:
  backend: "dense"
  embedding_model: "BAAI/bge-small-en-v1.5"
  dimension: 384
  top_k_options: [1, 3, 5, 10]

training:
  batch_size: 2
  gradient_accumulation_steps: 8
  epochs: 3
  learning_rate: 0.0002
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  data_fractions: [0.01, 0.05, 0.10, 0.25, 0.50, 1.00]
  rank_ablations: [4, 8, 16]
  noise_ratios: [0.00, 0.05, 0.10, 0.20]

evaluation:
  max_samples: null
  timeout_seconds: 5.0
