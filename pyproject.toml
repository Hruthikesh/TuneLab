[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tunelab"
version = "0.1.0"
description = "A research benchmark comparing Prompting, RAG, LoRA, and QLoRA for Text-to-SQL SLMs"
authors = [{ name = "TuneLab Student Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
deep-learning = [
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "peft>=0.9.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.42.0",
    "sentence-transformers>=2.5.0"
]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
