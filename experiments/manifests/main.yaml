# Tier C: Main Research Experiment Manifest
manifest_name: "main_research_matrix"
description: "Comprehensive controlled experiment matrix addressing the core research questions."

experiments:
  # -------------------------------------------------------------
  # 1. Primary Method Comparison (100% data, Seed 42)
  # -------------------------------------------------------------
  - experiment_id: "EXP01_ZERO_SHOT"
    method: "ZERO_SHOT"
    model: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
    dataset: "spider"
    dataset_version: "1.0"
    data_fraction: 1.0
    seed: 42
    hardware_requirements: "cuda"

  - experiment_id: "EXP01_FEW_SHOT_K3"
    method: "FEW_SHOT"
    model: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
    dataset: "spider"
    dataset_version: "1.0"
    data_fraction: 1.0
    seed: 42
    training_settings: { few_shot_k: 3 }
    hardware_requirements: "cuda"

  - experiment_id: "EXP01_RAG_K3"
    method: "RAG"
    model: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
    dataset: "spider"
    dataset_version: "1.0"
    data_fraction: 1.0
    rag_k: 3
    seed: 42
    hardware_requirements: "cuda"

  - experiment_id: "EXP01_LORA_R8"
    method: "LORA"
    model: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
    dataset: "spider"
    dataset_version: "1.0"
    data_fraction: 1.0
    lora_rank: 8
    seed: 42
    hardware_requirements: "cuda"

  - experiment_id: "EXP01_QLORA_R8"
    method: "QLORA"
    model: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
    dataset: "spider"
    dataset_version: "1.0"
    data_fraction: 1.0
    lora_rank: 8
    qlora_config: { load_in_4bit: true, quant_type: "nf4", double_quant: true, compute_dtype: "bfloat16" }
    seed: 42
    hardware_requirements: "cuda"

